sse:
  initialDelayInMinutes: 0
  refreshIntervalMinutes: 1
  matchTimeOutMs: 7200000

charts:
  ttlSeconds: 86400
  pollingMilli: 180000
  schedulingEnabled: true
  momentumWindowSize: 5
  controlWindowSize: 5
  goalThreatWindowSize: 5
  idleBackoffMilli: 1800000
  activeWindowMilli: 7800000
  oddsPollingMilli: 300000
  oddsTrackedMarketNames:
    - fulltime_result
    - double_chance
    - both_teams_to_score
  trackedLeagueIds:
    - 1    # World Cup
    - 39   # England - Premier League
    - 140  # Spain - La Liga

today-players:
  ttlSeconds: 129600
  trackedLeagueIds:
    - 1    # World Cup
    - 39   # England - Premier League
    - 140  # Spain - La Liga
  attackerMarkets:
    - anytime_goal_scorer
    - player_assists
  midfieldMarkets:
    - anytime_goal_scorer
    - player_assists
  goalkeeperMarkets:
    - goalkeeper_saves
  defenderMarkets:
    - player_fouls_committed
    - player_to_be_booked
  nonPlayerOddsValues:
    - Yes
    - No
    - No Goalscorer

cors:
  allowed:
    - http://localhost:5173
    - http://localhost:45678
    - http://localhost:1111

rss:
  feeds:
